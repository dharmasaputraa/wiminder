<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <title>wiminder</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('wiminder.theme')
          if (theme !== 'light' && theme !== 'dark' && theme !== 'system') theme = 'system'
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          // Favicon can't see the page's dark class, so point it at the white variant directly.
          document.querySelector('link[rel="icon"]').href = dark ? '/favicon-dark.svg' : '/favicon.svg'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
