# Backend hot reload for dev: run via `make dev` (go tool air).
# Dev env (APP_SECRET, AUTH_MODE, DATA_DIR) is set in the Makefile target.
# The SPA is not rebuilt here — while working on the frontend, run `cd web && npm run dev`
# (Vite HMR, /api proxied to :8080); the embedded SPA is only frozen again by `make build`.
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/wiminder-dev"
  cmd = "go build -o ./tmp/wiminder-dev ./cmd/server"
  delay = 1000
  # Only .go file changes trigger a rebuild; _test.go is ignored so a running
  # `go test` does not trigger repeated builds.
  include_dir = ["cmd", "internal"]
  include_ext = ["go"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  kill_delay = "0s"
  log = "build-errors.log"
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
