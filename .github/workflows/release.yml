name: Release

# Versioning flow: push a tag (git tag v1.2.3 && git push origin v1.2.3) →
# image pushed to GHCR as 1.2.3 / 1.2 / 1 / latest / sha-<sha> →
# Dokploy redeployed with the immutable sha-<sha> tag (not :latest, so two
# releases can't race and rollbacks target the exact image that shipped).
# Manual rollback: set an older tag in the Dokploy UI, or re-run this
# workflow from an old tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # rebuild + redeploy current commit (main only — guarded below)

# Serialize releases: two tags pushed in quick succession must not race each
# other at the registry / in redeploy order. Queue (don't cancel) so both
# releases still run, one after the other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # GitHub Release + notes
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
  DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
  DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
  APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }} # opsional: base URL app produksi

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # workflow_dispatch can be fired from any ref; only main may deploy,
      # because only commits on main have passed CI.
      - name: Guard — workflow_dispatch only from main
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "::error::workflow_dispatch hanya boleh dari main (ref: ${{ github.ref_name }})"
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go test
        run: go test ./... -race -count=1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v5.9.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Auto-generated release notes from PRs & commits since the previous tag.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          generate_release_notes: true

      - name: Deploy to Dokploy (pinned image)
        if: env.DOKPLOY_URL != '' && env.DOKPLOY_API_KEY != '' && env.DOKPLOY_APPLICATION_ID != ''
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -m1 'sha-')
          echo "Triggering Dokploy redeploy for ${IMAGE_TAG}..."
          code=$(curl -s -o /tmp/dokploy_resp.txt -w '%{http_code}' --retry 3 \
            -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\", \"dockerImage\": \"$IMAGE_TAG\"}")
          cat /tmp/dokploy_resp.txt
          # 3xx = e.g. Cloudflare Access intercepting the API call — fail the
          # job, don't fail silently
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy deploy gagal (HTTP $code)"
            exit 1
          fi
          echo "Dokploy deploy triggered."

      # Best-effort gate: set APP_HEALTH_URL (secret, the production app's
      # base URL) and the workflow waits for /healthz to return 200 after
      # deploy. Honest caveat: the old container may still be the one
      # answering during early polling — this proves "something healthy is
      # serving", not a full swap to the new version. It still catches
      # crash-loop / site-down cases.
      - name: Post-deploy health check
        if: env.APP_HEALTH_URL != ''
        run: |
          url="${APP_HEALTH_URL%/}/healthz"
          echo "Polling ${url} (maks ~3 menit setelah grace period)..."
          sleep 15
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy (HTTP 200)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check tidak kunjung 200 setelah deploy — periksa log deployment di Dokploy"
          exit 1
